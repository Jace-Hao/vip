<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会员数据查询台 · 洗衣管家</title>
<style>
  :root{
    --bg:#F4F6FB; --card:#FFFFFF; --ink:#1E2A3A; --muted:#66738A; --line:#E3E9F4;
    --brand:#3B6FD4; --brand-ink:#2B54A8; --brand-soft:#EEF3FC;
    --ok:#1FA463; --ok-soft:#E8F7EF; --bad:#D64545; --bad-soft:#FDECEC;
    --warn:#B7791F; --warn-soft:#FFF6E6; --purple:#7A5AF8; --purple-soft:#F1EDFF;
    --shadow:0 4px 16px rgba(31,42,68,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","微软雅黑",-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.65}
  button,input,select{font-family:inherit;font-size:14px}
  .topbar{background:linear-gradient(135deg,#2B54A8,#3B6FD4 60%,#5E8BE8);color:#fff;padding:14px 22px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(31,42,68,.18)}
  .topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px}
  .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.30);border-radius:999px;padding:2px 10px;white-space:nowrap}
  .spacer{flex:1}
  .btn{background:#fff;color:var(--brand-ink);border:1px solid #fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600;transition:.15s}
  .btn:hover{background:#EAF1FF}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.5)}
  .btn.ghost:hover{background:rgba(255,255,255,.25)}
  .btn:focus-visible,select:focus-visible,input:focus-visible,tr.row:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:20}
  .search{flex:1 1 280px;min-width:220px;position:relative}
  .search input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:10px;background:#FBFCFE}
  .search input:focus{border-color:var(--brand);background:#fff}
  .search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px;display:none}
  .search .clear:hover{color:var(--ink)}
  select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#FBFCFE;color:var(--ink);max-width:160px}
  .num{width:92px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#FBFCFE}
  .toolbar label.lbl{color:var(--muted);font-size:12.5px}
  .count{color:var(--muted);font-size:13px;white-space:nowrap}
  .count b{color:var(--brand-ink)}
  .layout{display:flex;gap:16px;padding:16px 22px 40px;align-items:flex-start}
  .listcard{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  table{border-collapse:separate;border-spacing:0;width:100%}
  thead th{position:sticky;top:0;background:#F2F6FD;color:#42536F;font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap;z-index:5}
  tbody td{padding:8px 10px;border-bottom:1px solid #EEF2F9;font-size:13.5px;vertical-align:middle}
  tr.row{cursor:pointer;transition:background .12s}
  tr.row:hover{background:#F7FAFF}
  tr.row.sel{background:#E9F1FF !important;box-shadow:inset 3px 0 0 var(--brand)}
  .nm{font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ph{color:#42536F;font-variant-numeric:tabular-nums;white-space:nowrap}
  .money{font-weight:700;color:#E8720C;font-variant-numeric:tabular-nums;white-space:nowrap}
  .muted{color:var(--muted)}
  .badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;line-height:1.7;white-space:nowrap}
  .b-level{background:var(--brand-soft);color:var(--brand-ink)}
  .b-level.full{background:#EEF1F6;color:#5A6B85}
  .b-level.agent{background:var(--warn-soft);color:var(--warn)}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .b-bad{background:var(--bad-soft);color:var(--bad)}
  .b-src{background:#F3F6FB;color:#5A6B85}
  mark{background:#FFF3B8;color:inherit;border-radius:3px;padding:0 1px}
  .pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:12px}
  .pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer}
  .pager button:hover:not(:disabled){border-color:var(--brand);color:var(--brand-ink)}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager button.cur{background:var(--brand);border-color:var(--brand);color:#fff}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .detail{flex:0 0 430px;position:sticky;top:108px;max-height:calc(100vh - 124px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .detail .hd{padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#F2F6FD,#EAF1FF)}
  .detail .hd .name{font-size:18px;font-weight:700}
  .detail .hd .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .detail .hd .row2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .sec{padding:12px 16px;border-bottom:1px solid #EEF2F9}
  .sec h3{margin:0 0 8px;font-size:13px;color:var(--brand-ink);letter-spacing:.5px}
  .kv{display:grid;grid-template-columns:104px 1fr;gap:4px 10px;font-size:13.5px}
  .kv .k{color:var(--muted)}
  .kv .v{word-break:break-all}
  .bigmoney{font-size:22px;font-weight:800;color:#E8720C;font-variant-numeric:tabular-nums}
  .minichips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
  .minichip{background:#F5F8FD;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;color:#42536F}
  .minichip b{color:var(--ink)}
  .voucher{background:#FAFCFE;border:1px solid #E6EDF8;border-radius:10px;padding:9px 11px;margin:6px 0}
  .v-title{font-weight:600;font-size:13.5px;color:var(--ink)}
  .v-sub{color:#66738A;font-size:12px;margin-top:1px}
  .v-dates{color:#66738A;font-size:12.5px;margin:3px 0 5px}
  .v-dates b{color:#42536F}
  .ordtable{width:100%;font-size:12.5px}
  .ordtable th{position:static;background:#F7FAFF;padding:6px 8px;border-bottom:1px solid var(--line);color:#42536F;font-weight:600;white-space:nowrap}
  .ordtable td{padding:6px 8px;border-bottom:1px solid #F1F5FB;white-space:nowrap}
  /* 订单卡片（分片懒加载区） */
  .o-card{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#FBFCFE}
  .o-hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:8px 11px;cursor:pointer}
  .o-hd:hover{background:#F4F8FF}
  .o-sn2{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
  .o-st2{font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--muted)}
  .o-amt2{color:#E8720C;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
  .o-dt2{color:var(--muted);font-size:12px;width:100%}
  .o-tog{font-size:11.5px;color:var(--brand-ink)}
  .o-bd{padding:4px 11px 10px;border-top:1px dashed var(--line)}
  .o-gt{width:100%;font-size:12px}
  .o-gt th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:3px 6px 3px 0}
  .o-gt td{border-bottom:1px solid #F1F5FB;padding:3px 6px 3px 0;white-space:nowrap}
  .o-ph{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
  .o-ph figure{margin:0}
  .o-ph img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:3px;background:#eceff3;display:block}
  .o-ph figcaption{font-size:10.5px;color:var(--muted);margin-top:2px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .o-pay{font-size:12px;color:var(--muted);margin-top:4px}
  details.sys{margin:0;padding:12px 16px}
  details.sys summary{cursor:pointer;color:var(--brand-ink);font-weight:600;font-size:13px}
  details.sys .kv{margin-top:8px}
  .copybtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:#42536F}
  .copybtn:hover{border-color:var(--brand);color:var(--brand-ink)}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1E2A3A;color:#fff;border-radius:10px;padding:9px 18px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:13.5px}
  .toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  .noflow{max-width:760px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 40px;box-shadow:var(--shadow)}
  .noflow h2{margin:0 0 10px;color:var(--brand-ink)}
  .noflow code{background:var(--brand-soft);border-radius:6px;padding:1px 7px;color:var(--brand-ink)}
  .detail .close{display:none}
  @media (max-width:1180px){
    .layout{position:relative;padding:12px 12px 40px}
    .detail{position:fixed;right:0;top:0;bottom:0;width:min(480px,92vw);max-height:none;height:100vh;border-radius:0;z-index:60;transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 30px rgba(31,42,68,.18)}
    .detail.open{transform:translateX(0)}
    .detail .close{display:inline-block;position:absolute;right:10px;top:10px;border:0;background:rgba(255,255,255,.7);border-radius:8px;font-size:16px;cursor:pointer;padding:2px 8px;z-index:5}
    .topbar{position:static}
    .toolbar{top:0}
  }
  @media (max-width:760px){
    .topbar{padding:12px 14px}
    .toolbar{padding:10px 14px}
    .hide-sm{display:none}
    .nm{max-width:140px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>会员数据查询台</h1>
    <div class="meta" id="metaChips"></div>
    <div class="spacer"></div>
    <button class="btn" id="btnCsv">导出筛选结果 CSV</button>
  </div>
  <div class="toolbar">
    <div class="search">
      <input id="q" type="search" placeholder="搜索：姓名 / 电话 / 拼音 / 卡号 / 订单号 / 标签 / 备注…" autocomplete="off">
      <button class="clear" id="qClear" title="清空">✕</button>
    </div>
    <label class="lbl hide-sm">级别</label><select id="fLevel"><option value="">全部</option></select>
    <label class="lbl hide-sm">来源</label><select id="fSource"><option value="">全部</option></select>
    <label class="lbl hide-sm">状态</label><select id="fStatus"><option value="">全部</option><option value="0">正常</option><option value="1">禁用</option></select>
    <label class="lbl hide-sm">余额</label>
    <input class="num" id="balMin" type="number" placeholder="最低(元)">
    <input class="num" id="balMax" type="number" placeholder="最高(元)">
    <label class="lbl hide-sm">排序</label>
    <select id="fSort">
      <option value="ctime_desc">注册时间（新→旧）</option>
      <option value="balance_desc">余额（高→低）</option>
      <option value="onum_desc">订单数（多→少）</option>
      <option value="name_asc">姓名</option>
    </select>
    <select id="fSize" class="hide-sm"><option value="50">50/页</option><option value="100">100/页</option><option value="200">200/页</option></select>
    <span class="count" id="countText"></span>
  </div>
  <div class="layout">
    <div class="listcard">
      <div style="overflow:auto;max-height:calc(100vh - 220px)">
        <table>
          <thead><tr>
            <th>姓名</th><th>电话</th><th>级别</th><th>余额(元)</th><th class="hide-sm">订单数</th><th class="hide-sm">注册时间</th><th class="hide-sm">来源</th><th>状态</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyBox" style="display:none">没有符合条件的会员</div>
      </div>
      <div class="pager" id="pager"></div>
    </div>
    <aside class="detail" id="detailBox">
      <button class="close" id="detailClose">✕</button>
      <div class="hd">
        <div class="name">选择一个会员</div>
        <div class="sub">点击左侧列表查看全部资料与详情</div>
      </div>
      <div class="sec"><div class="muted">这里会显示该会员的：基本资料、账户与余额、消费统计、订单明细、卡券信息，以及全部原始字段。</div></div>
    </aside>
  </div>
  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
  (function(){
    'use strict';
    var D = window.MEMBER_DATA || null;

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function fmtYuan(cents){
      var n = Number(cents);
      if(!isFinite(n)) return '—';
      return (n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    }
    function rawMoney(cents){ // 分 → 数字
      var n = Number(cents); return isFinite(n)? n/100 : null;
    }
    function badgeLevel(v){
      var cls='b-level'; if(v==='全价会员') cls+=' full'; else if(v==='代收点') cls+=' agent';
      return '<span class="badge '+cls+'">'+esc(v||'—')+'</span>';
    }
    function badgeStatus(s){
      return s===0||s==='0' ? '<span class="badge b-ok">正常</span>' : (s===1||s==='1' ? '<span class="badge b-bad">禁用</span>' : '<span class="badge b-src">'+esc(s)+'</span>');
    }
    function hl(text,q){
      var t = esc(text==null?'':text);
      if(!q) return t;
      var out='', lower=t.toLowerCase(), ql=q.toLowerCase(), i=0;
      while(true){
        var p = lower.indexOf(ql,i);
        if(p<0){ out+=t.slice(i); break; }
        out += t.slice(i,p)+'<mark>'+t.slice(p,p+q.length)+'</mark>';
        i = p+q.length;
      }
      return out;
    }
    var toastTimer=null;
    function toast(msg){
      var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
      clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.classList.remove('show');},1800);
    }
    function copyText(t){
      var done=function(){toast('已复制：'+t);};
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(done,function(){fallback();});
      } else fallback();
      function fallback(){
        try{
          var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
        }catch(e){ toast('复制失败，请手动选择复制'); }
      }
    }

    if(!D){
      document.body.innerHTML = '<div class="noflow"><h2>还没有可用的数据</h2>'+
        '<p>本页面需要同目录下的 <code>data.js</code> 数据文件（由工具自动生成）。</p>'+
        '<ol><li>先在「洗衣管家会员导出」工具里完成一次导出（<code>导出会员数据.cmd</code> 或 <code>导出会员数据(含详情).cmd</code>）；</li>'+
        '<li>然后双击工具目录下的 <code>打开会员查询页面.cmd</code>，会自动生成本页面所需的数据并打开。</li></ol>'+
        '<p class="muted">如果你直接双击了本页面：请关闭它，改用上面的步骤。</p></div>';
      return;
    }

    /* ---------- 准备数据 ---------- */
    var members = (D.members||[]).slice();
    var details = D.details||{};
    var labels = D.labels||{};
    var L = function(k){ return labels[k]||k; };

    /* 卡券字段的专用中文名（name 在卡券里指卡券名称，而非会员姓名） */
    var VOUCHER_LABELS = {
      name:'名称', sdate:'起始日期', edate:'到期日期',
      cardid:'卡ID', ticketid:'券ID', tid:'券模板ID', cloth_name:'适用衣物',
      times:'总次数', utimes:'已用次数', canuse:'可用范围',
      ctids:'适用品类', wcids:'关联品类1', gcids:'关联品类2', jcids:'关联品类3',
      overdue:'是否过期', expired:'是否失效', torderid:'关联订单', taskid:'活动ID',
      limitrmb:'门槛·分', prmb:'原价·分', trmb:'累计金额·分', ormb:'订单金额·分',
      ctype:'卡类型', ntype:'次数类型', rtype:'限次类型', reason:'原因码', cnum:'编号', title:'说明',
      cut:'折扣值', status:'状态', type:'类型', code:'券码', cid:'关联ID'
    };
    var vlabel = function(k){ return VOUCHER_LABELS[k] || L(k); };
    var MONEY_KEYS = { rmb:1, trmb:1, prmb:1, limitrmb:1, ormb:1 };

    members.forEach(function(m){
      m._uid = String(m.uid==null?'':m.uid);
      m._name = (m.name==null?'':String(m.name));
      m._phone = (m.phone==null?'':String(m.phone));
      m._bal = isFinite(Number(m.balance))?Number(m.balance):0;
      m._det = details[m._uid]||null;
      var tag = (m._det&&m._det.tagname)||m.tagids||'';
      m._search = (m._name+' '+m._phone+' '+(m.py||'')+' '+(m.cardnum||'')+' '+(m.scode||'')+' '+tag+' '+(m.note||'')).toLowerCase();
      if(D.orderSearch && D.orderSearch[m._uid]) m._search += ' ' + String(D.orderSearch[m._uid]).toLowerCase();
      if(m._det && m._det.order && m._det.order.list){
        var ids=m._det.order.list.map(function(o){return (o.orderid||'')+' '+(o.sncode||'');}).join(' ');
        m._search += ' '+ids.toLowerCase();
      }
    });

    var levels=[], sources=[];
    members.forEach(function(m){
      var v=m.vip_name||m.vipname||''; if(v&&levels.indexOf(v)<0) levels.push(v);
      var s=m.source||''; if(s&&sources.indexOf(s)<0) sources.push(s);
    });
    (function(){
      var sel=document.getElementById('fLevel'); levels.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});
      var sel2=document.getElementById('fSource'); sources.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;sel2.appendChild(o);});
    })();

    var sumCents = members.reduce(function(a,m){return a+m._bal;},0);
    var detCount = members.filter(function(m){return !!m._det;}).length;
    (function(){
      var chips=[
        '门店：'+esc(D.shop||'—'),
        '会员：'+members.length+' 人',
        '余额合计：¥'+fmtYuan(sumCents),
        '详情覆盖：'+detCount+' / '+members.length,
        '数据时间：'+esc((D.exportStamp||'').replace(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/,'$1-$2-$3 $4:$5:$6'))
      ];
      if(D.orderMeta && D.orderMeta.covered) chips.push('订单数据：'+D.orderMeta.covered+' 人 / '+D.orderMeta.orders+' 单');
      if(D.softwareVersion) chips.push('软件版本：'+esc(D.softwareVersion));
      document.getElementById('metaChips').innerHTML = chips.filter(Boolean).map(function(c){return '<span class="chip">'+c+'</span>';}).join('');
    })();

    /* ---------- 订单分片懒加载与订单卡片 ---------- */
    var ORDER_PART_CBS = {};
    function loadOrderPart(part, cb){
      if(window.ORDER_PARTS && window.ORDER_PARTS[part]){ cb(null); return; }
      if(ORDER_PART_CBS[part]){ ORDER_PART_CBS[part].push(cb); return; }
      ORDER_PART_CBS[part] = [cb];
      var s = document.createElement('script');
      s.src = '订单分片/' + part + '.js';
      s.onload = function(){ (ORDER_PART_CBS[part]||[]).forEach(function(f){ try{ f(null); }catch(e){} }); delete ORDER_PART_CBS[part]; };
      s.onerror = function(){ (ORDER_PART_CBS[part]||[]).forEach(function(f){ try{ f('load'); }catch(e){} }); delete ORDER_PART_CBS[part]; };
      document.head.appendChild(s);
    }
    function orderSummaryCardHtml(o){
      var st = o.wstatus != null ? ('状态码 ' + o.wstatus) : '—';

    /* ---------- 状态与筛选 ---------- */
    var state={q:'',level:'',source:'',status:'',balMin:null,balMax:null,sort:'ctime_desc',page:1,size:50,sel:null};

    function filtered(){
      var q=state.q.trim().toLowerCase();
      var arr=members.filter(function(m){
        if(q && m._search.indexOf(q)<0) return false;
        if(state.level && (m.vip_name||m.vipname||'')!==state.level) return false;
        if(state.source && (m.source||'')!==state.source) return false;
        if(state.status!=='' && String(m.status)!==state.status) return false;
        if(state.balMin!=null && m._bal < Math.round(state.balMin*100)) return false;
        if(state.balMax!=null && m._bal > Math.round(state.balMax*100)) return false;
        return true;
      });
      var s=state.sort;
      arr.sort(function(a,b){
        if(s==='balance_desc') return b._bal-a._bal;
        if(s==='onum_desc') return (Number(b.onum)||0)-(Number(a.onum)||0);
        if(s==='name_asc') return a._name.localeCompare(b._name,'zh-Hans-CN');
        return (b.ctime||'').localeCompare(a.ctime||''); /* ctime_desc */
      });
      return arr;
    }

    function renderPager(pages){

      html+=b('上一页',p-1,p<=1,false);
      var from=Math.max(1,p-3), to=Math.min(pages,p+3);
      if(from>1) html+='<span class="muted">…</span>';
      for(var i=from;i<=to;i++) html+=b(String(i),i,false,i===p);
      if(to<pages) html+='<span class="muted">…</span>';
      html+=b('下一页',p+1,p>=pages,false);
      html+=b('末页',pages,p>=pages,p===pages);

      var arr=filtered(); if(!arr.length){ toast('当前没有可导出的数据'); return; }
      var cols=[
        ['会员ID','uid'],['姓名','name'],['电话','phone'],['级别','vip_name'],['账户余额(元)','balanceYuan'],
        ['充值余额(元)','cbalanceYuan'],['赠送余额(元)','zbalanceYuan'],['会员卡号','cardText'],['积分','score'],
        ['订单数','onum'],['累计消费(元)','ormbYuan'],['注册时间','ctime'],['来源','source'],['状态','statusText'],['标签','tagText'],['备注','note']
      ];
      function row(m){
        var d=m._det||{};
        return {
          uid:m._uid, name:m._name, phone:m._phone, vip_name:(m.vip_name||m.vipname||''),
          balanceYuan:(m._bal/100).toFixed(2),
          cbalanceYuan:(Number(d.cbalance!=null?d.cbalance:m.b_crmb)/100).toFixed(2),
          zbalanceYuan:(Number(d.zbalance!=null?d.zbalance:m.b_zrmb)/100).toFixed(2),
          cardText:(m.scode||(m.cardnum&&String(m.cardnum)!=='0'?m.cardnum:'')),
          score:Number(m.score)||0,
          onum:Number(m.onum)||0,
          ormbYuan:(Number(m.ormb)/100||0).toFixed(2),
          ctime:m.ctime||'', source:m.source||'',
          statusText: (m.status===0||m.status==='0')?'正常':((m.status===1||m.status==='1')?'禁用':String(m.status)),
          tagText:(d.tagname||m.tagids||''), note:m.note||''
        };
      }
      var escCsv=function(v){ var s=(v==null?'':String(v)); return /[",\r\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"':s; };
      var lines=[cols.map(function(c){return c[0];}).join(',')];
      arr.forEach(function(m){ var r=row(m); lines.push(cols.map(function(c){return escCsv(r[c[1]]);}).join(',')); });
      var blob=new Blob(['\uFEFF'+lines.join('\r\n')+'\r\n'],{type:'text/csv;charset=utf-8'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      var d=new Date(),p=function(x){return String(x).padStart(2,'0');};
      a.download='会员筛选_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.csv';
      document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},400);
      toast('已导出 '+arr.length+' 条到 CSV');
    }

    bind();
    render();
  })();
  </script>
</body>
</html>
